# Dashboard secrets are entered when the Blueprint is created, never in Git.
services:
  - type: web
    name: truckmena-api
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DJANGO_SETTINGS_MODULE
        value: config.production_settings
      - key: DJANGO_DEBUG
        value: "false"
      # Supply a 50+ character secret; Render's generator produces only 44.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_TRUST_PROXY
        value: "true"
      - key: ORS_API_KEY
        sync: false
      # Enter the actual Vercel origin, or the documented temporary closed origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NOMINATIM_ENABLED
        value: "false"
