name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend: ${{ steps.apps.outputs.backend }}
      frontend: ${{ steps.apps.outputs.frontend }}
    steps:
      - name: Check out source and history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install repository tooling
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Detect applications introduced by subsequent phases
        id: apps
        shell: bash
        run: |
          backend=false
          frontend=false
          if [ -f backend/requirements-dev.txt ]; then backend=true; fi
          if [ -f frontend/package.json ]; then frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
      - name: Install frontend tools when the frontend exists
        if: steps.apps.outputs.frontend == 'true'
        run: npm ci --prefix frontend
      - name: Check formatting, file hygiene, and secrets
        run: python -m pre_commit run --all-files --hook-stage manual

  backend:
    name: Backend quality and tests
    needs: repository
    if: needs.repository.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        run: python -m ruff check backend
      - name: Check Python formatting
        run: python -m black --check backend
      - name: Test
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend quality, tests, and build
    needs: repository
    if: needs.repository.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build
